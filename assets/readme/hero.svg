<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">dingtalk-weekly-report</title>
  <desc id="desc">把工作日志变成人工审核后的氚云周报草稿，最终提交始终由用户完成。</desc>

  <rect width="1200" height="400" rx="30" fill="#0B1220"/>

  <g stroke="#9FB0C7" stroke-width="1" opacity="0.08">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200"/>
    <path d="M100 0V400M200 0V400M300 0V400M400 0V400M500 0V400M600 0V400M700 0V400M800 0V400M900 0V400M1000 0V400M1100 0V400"/>
  </g>

  <g font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(64 54)">
      <text x="0" y="0" dominant-baseline="hanging"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" letter-spacing="2.2" fill="#9FB0C7">
        H3YUN WEEKLY REPORT · AGENT SKILL
      </text>

      <text x="0" y="62"
            font-family="'Noto Sans', 'Segoe UI', Arial, sans-serif"
            font-size="58" font-weight="700" fill="#F7F4EC">
        dingtalk
      </text>
      <text x="0" y="122"
            font-family="'Noto Sans', 'Segoe UI', Arial, sans-serif"
            font-size="58" font-weight="700" fill="#F7F4EC">
        weekly-report
      </text>

      <text x="0" y="179" font-size="27" font-weight="700" fill="#F7F4EC">
        工作日志，经过人审，才进入氚云草稿
      </text>
      <text x="0" y="216" font-size="21" fill="#9FB0C7">
        内容由你确认 · 草稿由工具填写 · 提交由你完成
      </text>

      <g transform="translate(0 258)">
        <rect width="182" height="42" rx="21" fill="#246BDE"/>
        <text x="91" y="27" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="17" font-weight="700" fill="#F7F4EC">
          NO AUTO SUBMIT
        </text>
        <rect x="196" width="196" height="42" rx="21"
              fill="none" stroke="#9FB0C7" stroke-width="1.5"/>
        <text x="294" y="27" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="17" font-weight="700" fill="#F7F4EC">
          PRIVATE $WORK
        </text>
      </g>
    </g>

    <g transform="translate(748 42)">
      <rect width="396" height="316" rx="22" fill="#F7F4EC"/>
      <rect x="20" y="20" width="356" height="52" rx="12" fill="#111B2D"/>
      <text x="40" y="53" font-size="23" font-weight="700" fill="#F7F4EC">报工周报</text>
      <rect x="282" y="29" width="76" height="34" rx="17" fill="#F4B740"/>
      <text x="320" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#0B1220">草稿</text>

      <g transform="translate(28 94)" font-size="18">
        <g>
          <rect width="340" height="46" rx="10" fill="#FFFFFF"/>
          <circle cx="24" cy="23" r="9" fill="#246BDE"/>
          <path d="M19 23l4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
          <text x="46" y="29" fill="#111B2D">周一 · 工作日志已整理</text>
          <text x="316" y="29" text-anchor="end" fill="#607086">8h</text>
        </g>
        <g transform="translate(0 56)">
          <rect width="340" height="46" rx="10" fill="#FFFFFF"/>
          <circle cx="24" cy="23" r="9" fill="#246BDE"/>
          <path d="M19 23l4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
          <text x="46" y="29" fill="#111B2D">周二 · 内容与工时已人审</text>
          <text x="316" y="29" text-anchor="end" fill="#607086">8h</text>
        </g>
        <g transform="translate(0 112)">
          <rect width="340" height="46" rx="10" fill="#FFFFFF"/>
          <circle cx="24" cy="23" r="9" fill="#246BDE"/>
          <path d="M19 23l4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
          <text x="46" y="29" fill="#111B2D">附件 · XLSX 已挂载</text>
          <text x="316" y="29" text-anchor="end" fill="#607086">OK</text>
        </g>
      </g>

      <path d="M28 278H368" stroke="#D7DDE6"/>
      <g transform="translate(28 287)">
        <circle cx="14" cy="0" r="11" fill="#F4B740"/>
        <circle cx="14" cy="-3" r="3.5" fill="#0B1220"/>
        <path d="M7 7c2-5 12-5 14 0" fill="none" stroke="#0B1220" stroke-width="2"/>
        <text x="36" y="6" font-size="18" font-weight="700" fill="#111B2D">
          人工核对后，用户在钉钉提交
        </text>
      </g>
    </g>
  </g>
</svg>
