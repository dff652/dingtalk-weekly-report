<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">从工作日志到钉钉提交的五步流程</title>
  <desc id="desc">工作日志先生成周报 JSON 并由用户审核，再生成 XLSX、写入氚云草稿，最后由用户在钉钉提交。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#246BDE"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="30" fill="#F7F4EC"/>

  <g font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="60" y="68"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2" fill="#607086">A FAIL-CLOSED SEQUENCE</text>
    <text x="60" y="119" font-size="42" font-weight="700" fill="#0B1220">
      从日志到草稿，五步都有边界
    </text>
    <text x="60" y="151" font-size="20" fill="#607086">
      只有最后一步离开工具：提交必须由用户亲手完成
    </text>

    <g stroke="#246BDE" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M260 300H282"/>
      <path d="M480 300H502"/>
      <path d="M700 300H722"/>
      <path d="M920 300H942"/>
    </g>

    <g transform="translate(50 190)">
      <rect width="210" height="250" rx="20" fill="#FFFFFF" stroke="#D7DDE6"/>
      <text x="24" y="38"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700" fill="#246BDE">01 / SOURCE</text>
      <g transform="translate(65 64)" stroke="#0B1220" stroke-width="3" fill="none">
        <rect width="80" height="74" rx="8"/>
        <path d="M16 22H64M16 38H58M16 54H48"/>
      </g>
      <text x="105" y="171" text-anchor="middle" font-size="27" font-weight="700" fill="#0B1220">工作日志</text>
      <text x="105" y="204" text-anchor="middle" font-size="19" fill="#607086">只读固定 Markdown</text>
      <text x="105" y="229" text-anchor="middle" font-size="19" fill="#607086">不扫描代码或 git</text>
    </g>

    <g transform="translate(270 190)">
      <rect width="210" height="250" rx="20" fill="#FFFFFF" stroke="#D7DDE6"/>
      <text x="24" y="38"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700" fill="#246BDE">02 / REVIEW</text>
      <g transform="translate(68 64)">
        <circle cx="37" cy="37" r="36" fill="none" stroke="#0B1220" stroke-width="3"/>
        <path d="M18 38l13 13 25-29" fill="none" stroke="#246BDE" stroke-width="6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="105" y="171" text-anchor="middle" font-size="27" font-weight="700" fill="#0B1220">JSON 人审</text>
      <text x="105" y="204" text-anchor="middle" font-size="19" fill="#607086">逐日内容与工时</text>
      <text x="105" y="229" text-anchor="middle" font-size="19" fill="#607086">确认后才继续</text>
    </g>

    <g transform="translate(490 190)">
      <rect width="210" height="250" rx="20" fill="#FFFFFF" stroke="#D7DDE6"/>
      <text x="24" y="38"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700" fill="#246BDE">03 / ATTACH</text>
      <g transform="translate(64 64)" stroke="#0B1220" stroke-width="3" fill="none">
        <rect width="82" height="74" rx="8"/>
        <path d="M27 0V74M54 0V74M0 25H82M0 50H82"/>
      </g>
      <text x="105" y="171" text-anchor="middle" font-size="27" font-weight="700" fill="#0B1220">生成 XLSX</text>
      <text x="105" y="204" text-anchor="middle" font-size="19" fill="#607086">附件与 JSON 同源</text>
      <text x="105" y="229" text-anchor="middle" font-size="19" fill="#607086">上传必须有证据</text>
    </g>

    <g transform="translate(710 190)">
      <rect width="210" height="250" rx="20" fill="#111B2D" stroke="#111B2D"/>
      <text x="24" y="38"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700" fill="#9FB0C7">04 / DRAFT</text>
      <g transform="translate(60 64)">
        <rect width="90" height="74" rx="9" fill="#F7F4EC"/>
        <path d="M18 22H72M18 39H62M18 56H68" stroke="#0B1220" stroke-width="3"/>
        <rect x="50" y="-12" width="54" height="28" rx="14" fill="#F4B740"/>
        <text x="77" y="8" text-anchor="middle" font-size="15" font-weight="700" fill="#0B1220">草稿</text>
      </g>
      <text x="105" y="171" text-anchor="middle" font-size="27" font-weight="700" fill="#F7F4EC">写入氚云</text>
      <text x="105" y="204" text-anchor="middle" font-size="19" fill="#9FB0C7">必须双标志确认</text>
      <text x="105" y="229" text-anchor="middle" font-size="19" fill="#9FB0C7">工具到此为止</text>
    </g>

    <g transform="translate(930 190)">
      <rect width="220" height="250" rx="20" fill="#FFFFFF"
            stroke="#F4B740" stroke-width="3" stroke-dasharray="8 7"/>
      <text x="24" y="38"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700" fill="#A56A00">05 / HUMAN</text>
      <g transform="translate(72 62)">
        <circle cx="38" cy="26" r="18" fill="none" stroke="#0B1220" stroke-width="3"/>
        <path d="M8 74c4-26 56-26 60 0" fill="none" stroke="#0B1220" stroke-width="3"/>
        <circle cx="68" cy="56" r="16" fill="#F4B740"/>
        <path d="M60 56l6 6 11-13" fill="none" stroke="#0B1220" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="110" y="171" text-anchor="middle" font-size="27" font-weight="700" fill="#0B1220">人工提交</text>
      <text x="110" y="204" text-anchor="middle" font-size="19" fill="#607086">钉钉中再次核对</text>
      <text x="110" y="229" text-anchor="middle" font-size="19" fill="#607086">用户亲手点击</text>
    </g>
  </g>
</svg>
