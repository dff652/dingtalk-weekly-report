name: Issue assistance

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: issue-assistance-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  acknowledge:
    name: 固定安全回执
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Reply with the triage policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BODY: |
            感谢反馈。维护者会按项目的 Issue 处理流程审核、复现并回复。

            外部提及不会自动调用 AI、修改代码、创建 PR 或关闭 Issue。请勿在公开 Issue 中粘贴登录链接、令牌、Cookie 或组织私有配置。
        run: gh issue comment "$ISSUE_NUMBER" --body "$BODY"
